on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: R-CMD-check

# Increment this version when we want to clear cache
env:
  cache-version: v2

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: '4.6'}
          - {os: windows-latest, r: '4.6'}
          - {os: ubuntu-22.04,   r: 'devel', rspm: "https://packagemanager.rstudio.com/all/__linux__/jammy/latest"}
          - {os: ubuntu-22.04,   r: '4.6',  rspm: "https://packagemanager.rstudio.com/all/__linux__/jammy/latest"}
          - {os: ubuntu-22.04,   r: '4.5', rspm: "https://packagemanager.rstudio.com/all/__linux__/jammy/latest"}
          - {os: ubuntu-22.04,   r: '4.4', rspm: "https://packagemanager.rstudio.com/all/__linux__/jammy/latest"}
          - {os: ubuntu-22.04,   r: '4.3', rspm: "https://packagemanager.rstudio.com/all/__linux__/jammy/latest"}
          - {os: ubuntu-22.04,   r: '4.2', rspm: "https://packagemanager.rstudio.com/all/__linux__/jammy/latest"}
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
          writeLines(sprintf("R-%i.%i", getRversion()$major, getRversion()$minor), ".github/R-version")
        shell: Rscript {0}

      - name: Cache R packages
        if: runner.os != 'Windows'
        uses: actions/cache@v5.1.0
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          check-dir: '"check"'

      - name: Show testthat output
        if: always()
        run: find check -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@master
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: check
